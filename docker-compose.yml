services:
  # ========== INFRASTRUCTURE SERVICES ==========
  # Core infrastructure services required by the platform
  
  # PostgreSQL Database - Shared database for all microservices
  postgres:
    image: postgres:16-alpine
    container_name: sh-postgres
    restart: on-failure
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql  # Initialize schemas
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 300M

  # RabbitMQ Message Broker - Asynchronous event messaging
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sh-rabbitmq
    restart: on-failure
    ports:
      - "5672:5672"  # AMQP protocol port
      - "15672:15672"  # Management UI port (guest/guest)
    deploy:
      resources:
        limits:
          memory: 400M

  # Redis Cache - Stores latest telemetry data and session data
  redis:
    image: redis:7.2-alpine
    container_name: sh-redis
    restart: on-failure
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 100M

  # Keycloak - OAuth2/OIDC Identity Provider (optional, not enforced in demo mode)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: sh-keycloak
    command: start-dev --import-realm  # Development mode with realm import
    restart: on-failure
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
    deploy:
      resources:
        limits:
          memory: 700M

  # ========== MICROSERVICES ==========
  # Core application microservices
  
  # API Gateway - Entry point for all client requests
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: api-gateway/target/*.jar
    container_name: sh-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
    environment:
      - AUTH_SERVER_URL=http://sh-keycloak:8080
      - PATIENT_SERVICE_URL=http://sh-patient:8081
      - APPOINTMENT_SERVICE_URL=http://sh-appointment:8082
      - BILLING_SERVICE_URL=http://sh-billing:8083
      - DEVICE_SERVICE_URL=http://sh-device:8085
      - ANALYTICS_SERVICE_URL=http://sh-analytics:8086
      - ZIPKIN_ENDPOINT=http://sh-zipkin:9411/api/v2/spans
      - JAVA_OPTS=-Xmx384m -Xms128m
    deploy:
      resources:
        limits:
          memory: 512M

  # Patient Service - Manages patient registration and profiles
  patient-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: patient/target/*.jar
    container_name: sh-patient
    restart: on-failure
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - localstack  # For AWS Parameter Store (credentials)
    environment:
      - DB_HOST=sh-postgres
      - DB_PORT=5432
      - MQ_HOST=sh-rabbitmq
      - AWS_ENDPOINT=http://sh-localstack:4566
      - AUTH_SERVER_URL=http://sh-keycloak:8080
      - ZIPKIN_ENDPOINT=http://sh-zipkin:9411/api/v2/spans
      - JAVA_OPTS=-Xmx192m -Xms128m
    deploy:
      resources:
        limits:
          memory: 256M

  # Appointment Service - Handles appointment scheduling (with circuit breaker to patient service)
  appointment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: appointment/target/*.jar
    container_name: sh-appointment
    restart: on-failure
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    environment:
      - DB_HOST=sh-postgres
      - DB_PORT=5432
      - MQ_HOST=sh-rabbitmq
      - PATIENT_SERVICE_URL=http://sh-patient:8081
      - AUTH_SERVER_URL=http://sh-keycloak:8080
      - ZIPKIN_ENDPOINT=http://sh-zipkin:9411/api/v2/spans
      - JAVA_OPTS=-Xmx192m -Xms128m
    deploy:
      resources:
        limits:
          memory: 256M

  # Billing Service - Processes invoices and payments
  billing-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: billing/target/*.jar
    container_name: sh-billing
    restart: on-failure
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - localstack  # For S3 bucket uploads
    environment:
      - DB_HOST=sh-postgres
      - DB_PORT=5432
      - MQ_HOST=sh-rabbitmq
      - AWS_ENDPOINT=http://sh-localstack:4566
      - AUTH_SERVER_URL=http://sh-keycloak:8080
      - ZIPKIN_ENDPOINT=http://sh-zipkin:9411/api/v2/spans
      - JAVA_OPTS=-Xmx192m -Xms128m
    deploy:
      resources:
        limits:
          memory: 256M

  # Notification Service - Sends notifications based on domain events
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: notification/target/*.jar
    container_name: sh-notification
    restart: on-failure
    ports:
      - "8084:8084"
    depends_on:
      - rabbitmq
    environment:
      - MQ_HOST=sh-rabbitmq
      - AUTH_SERVER_URL=http://sh-keycloak:8080
      - ZIPKIN_ENDPOINT=http://sh-zipkin:9411/api/v2/spans
      - JAVA_OPTS=-Xmx192m -Xms128m
    deploy:
      resources:
        limits:
          memory: 300M

  # Device Service - Collects and manages telemetry data from medical devices
  device-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: device/target/*.jar
    container_name: sh-device
    restart: on-failure
    ports:
      - "8085:8085"
    depends_on:
      - redis  # Caches latest telemetry
      - postgres
    environment:
      - DB_HOST=sh-postgres
      - DB_PORT=5432
      - MQ_HOST=sh-rabbitmq
      - REDIS_HOST=sh-redis
      - AUTH_SERVER_URL=http://sh-keycloak:8080
      - ZIPKIN_ENDPOINT=http://sh-zipkin:9411/api/v2/spans
      - JAVA_OPTS=-Xmx192m -Xms128m
    deploy:
      resources:
        limits:
          memory: 256M

  # Analytics Service - Processes telemetry data and detects anomalies
  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: analytics/target/*.jar
    container_name: sh-analytics
    restart: on-failure
    ports:
      - "8086:8086"
    depends_on:
      - postgres
    environment:
      - DB_HOST=sh-postgres
      - DB_PORT=5432
      - MQ_HOST=sh-rabbitmq
      - AUTH_SERVER_URL=http://sh-keycloak:8080
      - ZIPKIN_ENDPOINT=http://sh-zipkin:9411/api/v2/spans
      - JAVA_OPTS=-Xmx192m -Xms128m
    deploy:
      resources:
        limits:
          memory: 256M

  # ========== MONITORING & OBSERVABILITY ==========
  # Services for metrics collection and visualization
  
  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:latest
    container_name: sh-prometheus
    restart: on-failure
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml  # Scrape configuration
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 256M

  # Grafana - Dashboard and visualization for Prometheus metrics
  grafana:
    image: grafana/grafana:latest
    container_name: sh-grafana
    ports:
      - "3000:3000"  # Web UI (admin/admin)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning  # Auto-provision dashboards & datasources
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

  # Zipkin - Distributed tracing for request tracking across services
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: sh-zipkin
    restart: on-failure
    ports:
      - "9411:9411"  # Web UI
    deploy:
      resources:
        limits:
          memory: 256M

  # ========== LOCAL CLOUD SIMULATION ==========
  # LocalStack - Simulates AWS services (S3, SSM) locally
  localstack:
    image: localstack/localstack:3.4
    container_name: sh-localstack
    restart: on-failure
    ports:
      - "4566:4566"  # LocalStack Edge endpoint
    environment:
      - SERVICES=s3,ssm  # S3 for file storage, SSM for configuration
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh  # Initialize AWS resources
    deploy:
      resources:
        limits:
          memory: 512M

  # ========== FRONTEND ==========
  # Angular web UI for the platform
  
  web-ui:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    container_name: sh-web-ui
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data: