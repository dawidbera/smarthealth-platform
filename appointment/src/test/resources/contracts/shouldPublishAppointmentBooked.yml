# Contract Test: Appointment Service - Publish Appointment Booked Event
# Tests that the appointment service publishes appointment booked events to RabbitMQ

# --- Spring Cloud Contract for Appointment Booked Event ---
description: "Publish appointment booked event"
label: "trigger_booked_event"  # Test scenario label

# Trigger condition
input:
  triggeredBy: triggerBookedEvent()

# Expected Message Output
outputMessage:
  sentTo: internal.exchange  # RabbitMQ exchange
  headers:
    amqp_routingKey: appointment.booked  # Message routing key
  body: "Appointment booked with ID: 1"  # Message payload
