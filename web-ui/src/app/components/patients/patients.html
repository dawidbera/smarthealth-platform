<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="bi bi-people me-2"></i>Patients Management</h2>
  <button class="btn btn-primary btn-sm" (click)="toggleModal()">
    <i class="bi bi-person-plus me-1"></i> Add Patient
  </button>
</div>

<!-- Modal Form -->
<div class="modal fade show" [class.d-block]="showModal" tabindex="-1" *ngIf="showModal" style="background: rgba(0,0,0,0.5)">
  <div class="modal-dialog">
    <div class="modal-content shadow-lg">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Register New Patient</h5>
        <button type="button" class="btn-close btn-close-white" (click)="toggleModal()"></button>
      </div>
      <form [formGroup]="patientForm" (ngSubmit)="onSubmit()">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" formControlName="firstName">
            </div>
            <div class="col-md-6">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" formControlName="lastName">
            </div>
            <div class="col-12">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" formControlName="email">
            </div>
            <div class="col-12">
              <label class="form-label">ID Number (e.g. Passport, SSN)</label>
              <input type="text" class="form-control" formControlName="nationalId" placeholder="Identification number" 
                     [class.is-invalid]="patientForm.get('nationalId')?.invalid && patientForm.get('nationalId')?.touched">
              <div class="invalid-feedback">
                ID Number is required.
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="toggleModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="patientForm.invalid">Save Patient</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <p class="mt-2 text-muted">Fetching data...</p>
</div>

<div *ngIf="!loading && error" class="alert alert-warning shadow-sm border-start border-4 border-warning">
  <div class="d-flex align-items-center">
    <i class="bi bi-exclamation-triangle-fill fs-4 me-3 text-warning"></i>
    <div>
      <strong>Intermittent Connection:</strong> {{ error }}
      <div class="mt-2">
        <button class="btn btn-warning btn-sm" (click)="loadPatients()">
          <i class="bi bi-arrow-clockwise me-1"></i> Try Again
        </button>
      </div>
    </div>
  </div>
</div>

<div *ngIf="!loading && !error" class="card shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>ID Number</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let patient of patients">
            <td><strong>{{ patient.firstName }} {{ patient.lastName }}</strong></td>
            <td>{{ patient.email }}</td>
            <td>{{ patient.nationalId }}</td>
            <td class="text-end">
              <button class="btn btn-outline-secondary btn-sm me-1"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
          <tr *ngIf="patients.length === 0">
            <td colspan="4" class="text-center py-4 text-muted">No patients found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
