<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="bi bi-calendar-check me-2"></i>Appointments</h2>
  <button class="btn btn-success btn-sm" (click)="toggleModal()">
    <i class="bi bi-plus-circle me-1"></i> Book Appointment
  </button>
</div>

<!-- Modal Form -->
<div class="modal fade show" [class.d-block]="showModal" tabindex="-1" *ngIf="showModal" style="background: rgba(0,0,0,0.5)">
  <div class="modal-dialog">
    <div class="modal-content shadow-lg">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Book New Appointment</h5>
        <button type="button" class="btn-close btn-close-white" (click)="toggleModal()"></button>
      </div>
      <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Select Patient</label>
            <select class="form-select" formControlName="patientId">
              <option value="">-- Choose Patient --</option>
              <option *ngFor="let p of patients" [value]="p.id">{{ p.firstName }} {{ p.lastName }} ({{ p.nationalId }})</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Doctor ID</label>
            <input type="number" class="form-control" formControlName="doctorId">
          </div>
          <div class="mb-3">
            <label class="form-label">Appointment Time</label>
            <input type="datetime-local" class="form-control" formControlName="appointmentTime">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="toggleModal()">Cancel</button>
          <button type="submit" class="btn btn-success" [disabled]="appointmentForm.invalid">Confirm Booking</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-success" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div *ngIf="!loading" class="card shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Patient</th>
            <th>Doctor ID</th>
            <th>Time</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let app of appointments">
            <td><strong>{{ getPatientName(app.patientId) }}</strong></td>
            <td>{{ app.doctorId }}</td>
            <td>{{ app.appointmentTime | date:'medium' }}</td>
            <td>
              <span class="badge" [ngClass]="app.status === 'BOOKED' ? 'bg-success' : 'bg-secondary'">
                {{ app.status }}
              </span>
            </td>
          </tr>
          <tr *ngIf="appointments.length === 0">
            <td colspan="4" class="text-center py-4 text-muted">No appointments scheduled.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
