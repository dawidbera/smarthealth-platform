# Billing Service Application Configuration
# This configuration file sets up the Billing Service for the SmartHealth Platform

# Server Configuration
server:
  port: 8083  # API endpoint port for the billing service

# Spring Boot Configuration
spring:
  application:
    name: billing-service  # Service identifier used for logging and monitoring
  
  # Database (PostgreSQL) Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/billing_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  
  # JPA/Hibernate ORM Configuration
  jpa:
    hibernate:
      ddl-auto: update  # Automatically create/update database schema
    show-sql: true  # Log SQL queries to console
    open-in-view: false  # Disable OpenSessionInView pattern
  
  # RabbitMQ Message Broker Configuration
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
  
  # AWS/Cloud Configuration (LocalStack in dev)
  cloud:
    aws:
      s3:
        endpoint: ${AWS_ENDPOINT:http://localhost:4566}
        region: us-east-1
        path-style-access-enabled: true
      credentials:
        access-key: test
        secret-key: test


# Actuator & Monitoring Configuration
# Exposes metrics, health checks, and tracing endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics  # Expose actuator endpoints
  endpoint:
    health:
      show-details: always  # Always show detailed health info
    prometheus:
      enabled: true  # Enable Prometheus metrics export
  
  # Distributed Tracing Configuration (Zipkin)
  tracing:
    sampling:
      probability: 1.0  # Trace 100% of requests (1.0 = 100%)
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}