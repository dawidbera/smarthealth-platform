# Continuous Integration Workflow
# Runs automated tests for both backend (Java) and frontend (Angular) on every push and PR

name: CI

# Trigger events
on:
  push:
    branches: [ main ]  # Run on push to main branch
  pull_request:
    branches: [ main ]  # Run on PR to main branch

jobs:
  # Backend Java Tests
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true" # Disable Ryuk to avoid permission issues on CI
    steps:
      # Check out the repository code
      - uses: actions/checkout@v4
      
      # Set up Java 21 development environment
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'  # Eclipse Temurin JDK distribution
          cache: maven  # Cache Maven dependencies
      
      # Build and run all tests including integration tests
      - name: Build and Test with Maven
        run: ./mvnw clean verify
      
      # Upload test reports on failure for debugging
      - name: Upload test reports on failure
        if: failure()  # Only run if previous step failed
        uses: actions/upload-artifact@v4
        with:
          name: all-test-reports
          path: |
            **/target/surefire-reports/**  # Unit test reports
            **/target/failsafe-reports/**  # Integration test reports
          if-no-files-found: ignore

  # Frontend Angular Tests
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code
      - uses: actions/checkout@v4
      
      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json
      
      # Install dependencies (use legacy peer deps for compatibility)
      - name: Install dependencies
        working-directory: web-ui
        run: npm ci --legacy-peer-deps
      
      # Run unit tests
      - name: Test
        working-directory: web-ui
        run: npm test
      
      # Build the frontend for production
      - name: Build
        working-directory: web-ui
        run: npm run build
