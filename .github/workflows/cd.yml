# Continuous Deployment Workflow
# Builds Docker images and publishes them to GitHub Container Registry (GHCR)

name: CD

# Trigger on push to main branch
on:
  push:
    branches: [ main ]

# Environment variables
env:
  REGISTRY: ghcr.io  # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build Phase: Compile and package all microservices
  build-artifacts:
    name: Build JARs and Web Assets
    runs-on: ubuntu-latest
    steps:
      # Check out the code
      - uses: actions/checkout@v4
      
      # Set up Java environment
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven  # Cache dependencies for faster builds
      
      # Build all microservice JARs
      - name: Build JARs
        run: ./mvnw clean package -DskipTests  # Skip tests (CI already runs them)
      
      # Upload JARs for use in next job
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: jars  # Artifact name
          path: |
            api-gateway/target/*.jar
            patient/target/*.jar
            appointment/target/*.jar
            billing/target/*.jar
            notification/target/*.jar
            device/target/*.jar
            analytics/target/*.jar
          retention-days: 1  # Keep for 1 day

  # Publish Phase: Build and push Docker images to GHCR
  publish-images:
    name: Publish Docker Images
    needs: build-artifacts  # Wait for artifacts from build job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Permission to push to container registry
    strategy:
      fail-fast: false  # Continue even if one service fails
      matrix:
        service:
          # Define all services to be containerized
          - name: api-gateway
            context: .
            dockerfile: Dockerfile
            jar_path: api-gateway/target/*.jar
          - name: patient-service
            context: .
            dockerfile: Dockerfile
            jar_path: patient/target/*.jar
          - name: appointment-service
            context: .
            dockerfile: Dockerfile
            jar_path: appointment/target/*.jar
          - name: billing-service
            context: .
            dockerfile: Dockerfile
            jar_path: billing/target/*.jar
          - name: notification-service
            context: .
            dockerfile: Dockerfile
            jar_path: notification/target/*.jar
          - name: device-service
            context: .
            dockerfile: Dockerfile
            jar_path: device/target/*.jar
          - name: analytics-service
            context: .
            dockerfile: Dockerfile
            jar_path: analytics/target/*.jar
          - name: web-ui  # Frontend (no JAR)
            context: .
            dockerfile: web-ui/Dockerfile
            jar_path: ""
    steps:
      # Check out the code
      - uses: actions/checkout@v4
      
      # Download previously built JARs (skip for web-ui)
      - name: Download JARs
        if: matrix.service.name != 'web-ui'
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: .

      # Resolve JAR glob to a concrete filename and expose as env var
      - name: Resolve JAR path
        if: matrix.service.name != 'web-ui'
        id: resolve-jar
        run: |
          set -e
          echo "Looking for files: ${{ matrix.service.jar_path }}"
          # Pick the main JAR (not stubs, not original)
          JAR=$(ls ${{ matrix.service.jar_path }} 2>/dev/null | grep -v "stubs" | grep -v "original" | head -n1 || true)
          if [ -z "$JAR" ]; then
            echo "No JAR found for pattern: ${{ matrix.service.jar_path }}"
            exit 1
          fi
          echo "Found JAR: $JAR"
          echo "JAR_PATH=$JAR" >> $GITHUB_ENV

      # Authenticate to GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate Docker image metadata (tags, labels)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch  # Tag with branch name
            type=sha,format=short  # Tag with short commit SHA
            latest  # Tag with 'latest'

      # Build and push Docker image to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true  # Push to registry
          tags: ${{ steps.meta.outputs.tags }}  # Apply tags
          labels: ${{ steps.meta.outputs.labels }}  # Apply labels
          build-args: |
            JAR_FILE=${{ env.JAR_PATH }}  # Pass resolved JAR path to Dockerfile
