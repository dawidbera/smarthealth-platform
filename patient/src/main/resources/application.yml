# --- Server Configuration ---
server:
  port: 8081

# --- Spring Core Configuration ---
spring:
  application:
    name: patient-service
  config:
    import: "optional:aws-parameterstore:/config/patient-service/"
  
  # --- AWS Configuration (Parameter Store) ---
  cloud:
    aws:
      parameterstore:
        endpoint: ${AWS_ENDPOINT:http://localhost:4566}
        region: us-east-1
      credentials:
        access-key: test
        secret-key: test

  # --- Database Configuration ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/patient_db
    driver-class-name: org.postgresql.Driver
    # Username and Password loaded from AWS Parameter Store
  
  # --- JPA/Hibernate Configuration ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # --- Message Broker Configuration ---
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: 5672


# --- Actuator & Monitoring Configuration ---
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  
  # --- Distributed Tracing (Zipkin) ---
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}