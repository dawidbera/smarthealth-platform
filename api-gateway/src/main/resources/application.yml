# --- Server Configuration ---
server:
  port: 8080

# --- Spring Core Configuration ---
spring:
  application:
    name: api-gateway
  
  # --- Security Configuration (OAuth2 / Keycloak) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/smarthealth
  
  # --- API Gateway Configuration ---
  cloud:
    gateway:
      # CORS Settings
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      
      # Routing Rules
      routes:
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/analytics/**
        - id: patient-service
          uri: ${PATIENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/patient/**
        - id: appointment-service
          uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/appointment/**
        - id: billing-service
          uri: ${BILLING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/billing/**
        - id: device-service
          uri: ${DEVICE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/device/**
          filters:
            - RewritePath=/device/(?<segment>.*),/$\{segment}

# --- Actuator & Monitoring Configuration ---
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  
  # --- Distributed Tracing (Zipkin) ---
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}