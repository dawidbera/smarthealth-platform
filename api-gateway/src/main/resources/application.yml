# API Gateway Application Configuration
# Central entry point for all microservices, handles routing and cross-cutting concerns

# Server Configuration
server:
  port: 8080  # Main API gateway port

# Spring Boot Configuration
spring:
  application:
    name: api-gateway  # Service identifier
  
  # Security Configuration (OAuth2 / Keycloak for authentication)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/smarthealth  # Keycloak realm
  
  # API Gateway Configuration
  cloud:
    gateway:
      # CORS (Cross-Origin Resource Sharing) Settings
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"  # Allow Angular frontend
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"  # Allow all headers
      
      # Routing Rules - Define how requests are routed to microservices
      routes:
        # Analytics Service Route
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/analytics/**  # Route /analytics/** to analytics service
        
        # Patient Service Route
        - id: patient-service
          uri: ${PATIENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/patient/**
        
        # Appointment Service Route
        - id: appointment-service
          uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/appointment/**
        
        # Billing Service Route
        - id: billing-service
          uri: ${BILLING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/billing/**
        
        # Device Service Route (with path rewriting)
        - id: device-service
          uri: ${DEVICE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/device/**
          filters:
            - RewritePath=/device/(?<segment>.*),/$\{segment}  # Remove /device prefix

# Actuator & Monitoring Configuration
# Exposes metrics and health check endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  
  # Distributed Tracing Configuration (Zipkin)
  tracing:
    sampling:
      probability: 1.0  # Trace 100% of requests
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}