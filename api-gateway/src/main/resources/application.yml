server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: http://localhost:8081
          predicates:
            - Path=/patient/**
        - id: appointment-service
          uri: http://localhost:8082
          predicates:
            - Path=/appointment/**
        - id: billing-service
          uri: http://localhost:8083
          predicates:
            - Path=/billing/**
        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/notification/**
        - id: device-service
          uri: http://localhost:8085
          predicates:
            - Path=/device/**
        - id: analytics-service
          uri: http://localhost:8086
          predicates:
            - Path=/analytics/**

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
